name: Météo CNews Patrick Automatique

on:
  schedule:
    # 17h00 heure française d'été (15h00 UTC)
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Mode test (envoyer uniquement à Grégory, pas à Patrick)"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  run-cnews-patrick:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer FFmpeg (requis pour la compilation vidéo)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Installer Playwright Chromium (pour les captures de cartes)
        run: |
          playwright install chromium

      - name: Lancer la génération et l'envoi CNews
        env:
          PYTHONUNBUFFERED: "1"
          CHROME_PATH: "/usr/bin/google-chrome"
          GMAIL_EMAIL: "langlet.gregory@gmail.com"
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TEST_MODE: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.test_mode == 'true') && 'true' || 'false' }}
        run: |
          python cnews/scripts/send_cnews_email.py

      - name: Publier le ZIP sur GitHub Releases (lien de téléchargement stable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP_PATH="cartes_alertes/bulletins_cnews_patrick.zip"
          TAG="bulletins-patrick-latest"
          # Supprimer le release existant s'il existe, ignorer l'erreur si absent
          gh release delete "$TAG" --yes 2>/dev/null || true
          # Créer un nouveau release avec le ZIP
          gh release create "$TAG" "$ZIP_PATH" \
            --title "Bulletins CNews Patrick - Dernière mise à jour" \
            --notes "Pack vidéo automatique du $(date '+%d/%m/%Y à %Hh%M'). Contient les 4 bulletins : France paysage, France TikTok, HDF paysage, HDF TikTok." \
            --latest
          echo "ZIP publié sur GitHub Releases avec succès."
