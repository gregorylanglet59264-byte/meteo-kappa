name: Météo Kappa - 2. Analyse Gemini Pro

on:
  schedule:
    # 17h30 heure française d'été (15h30 UTC)
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Mode test"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  run-analyse-gemini:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer l'analyse des cartes par Gemini Pro (Vision)
        env:
          PYTHONUNBUFFERED: "1"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python cnews/scripts/export_all_bulletins.py --day-offset 1

      - name: Commiter et pousser les textes de prévision (pour mise à jour Vercel)
        run: |
          git config --global user.name "Gregory LANGLET"
          git config --global user.email "langlet.gregory@gmail.com"
          git add cnews/AUTOMATISATION.json cnews/BULLETINS_AUTOMATIQUES_DEMAIN.json cnews/BULLETINS_AUTOMATIQUES_DEMAIN.txt
          git commit -m "Mise à jour automatique des prévisions Gemini Kappa [GHA]" || echo "Aucune prévision à commiter"
          git checkout -- .
          git clean -fd
          git pull --rebase origin main
          git push origin main
