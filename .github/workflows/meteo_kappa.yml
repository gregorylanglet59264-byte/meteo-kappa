name: Météo Kappa - 1. Cartes & Données

on:
  schedule:
    # 17h45 heure française d'été (15h45 UTC) - l'enchaînement automatique finira vers 18h00
    - cron: '45 15 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Mode test"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  run-cartes-kappa:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Installer Playwright Chromium (pour les captures de cartes)
        run: |
          playwright install chromium

      - name: Lancer la génération des cartes et de la structure du programme
        env:
          PYTHONUNBUFFERED: "1"
          CHROME_PATH: "/usr/bin/google-chrome"
        run: |
          python cnews/scripts/export_all_bulletins.py --day-offset 1 --generate-maps --skip-ai

      - name: Commiter et pousser les cartes et données (pour mise à jour Vercel)
        run: |
          git config --global user.name "Gregory LANGLET"
          git config --global user.email "langlet.gregory@gmail.com"
          # Forcer l'ajout des cartes .jpg générées bien qu'elles soient dans le dossier ignoré cartes_alertes/
          git add cnews/AUTOMATISATION.json cnews/BULLETINS_AUTOMATIQUES_DEMAIN.json cnews/BULLETINS_AUTOMATIQUES_DEMAIN.txt
          git add -f cartes_alertes/*.jpg || echo "Aucune carte jpg à ajouter"
          git commit -m "Mise à jour automatique des cartes et données Kappa [GHA]" || echo "Aucune modification à commiter"
          git checkout -- .
          git clean -fd
          git pull --rebase origin main
          git push origin main
