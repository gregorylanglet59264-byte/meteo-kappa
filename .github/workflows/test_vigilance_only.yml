name: Test Vigilance Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-vigilance:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          pip install playwright pillow
          playwright install chromium

      - name: Capturer uniquement la vigilance
        run: |
          python meteo_cnews_2/test_vigilance_only.py

      - name: Uploader les cartes de vigilance générées en artefacts
        uses: actions/upload-artifact@v4
        with:
          name: vigilance-cards
          path: |
            cartes_alertes/carte_vigilance_*.jpg
