name: Météo CNews Observations Automatique

on:
  schedule:
    # 18h45 heure française d'été (16h45 UTC)
    - cron: '45 16 * * *'
  workflow_dispatch:

concurrency:
  group: cnews-observations
  cancel-in-progress: false  # Ne pas annuler un run en cours, mettre en attente

permissions:
  contents: write

jobs:
  run-cnews-obs:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Installer Playwright Chromium (pour les captures de cartes)
        run: |
          playwright install chromium

      - name: Lancer la génération et l'envoi des observations CNews
        env:
          PYTHONUNBUFFERED: "1"
          GMAIL_EMAIL: "langlet.gregory@gmail.com"
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python cnews/scripts/send_cnews_obs_email.py

      - name: Commiter et pousser les nouvelles cartes d'observations sur GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f cartes_alertes/*.zip || true
          git add -f cartes_alertes/*.jpg || true
          git commit -m "chore: archivage automatique des cartes d'observations du $(date '+%d/%m/%Y')" || echo "Aucune modification à commiter"
          git pull --rebase origin main || true
          git push origin main || echo "Aucun push nécessaire"
